services:
  server:
    build:
      context: .
    volumes:
      - db_data_sqlite:/var/lib/kutt
      - custom:/kutt/custom
    environment:
      - DB_FILENAME=${DB_FILENAME:-/var/lib/kutt/data.sqlite}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      # Coolify Magic: Generates a unique domain that points to port 3000
      - SERVICE_FQDN_SERVER_3000
    expose:
      - "3000"
    depends_on:
      redis:
        condition: service_started
  
  redis:
    image: redis:alpine
    restart: always
    expose:
      - "6379"

volumes:
  db_data_sqlite:
  custom:
