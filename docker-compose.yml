version: "3.8"

volumes:
  db_data_pg:
  custom:

services:
  server:
    build:
      context: .
    volumes:
      - custom:/kutt/custom

    # 1) If you want Traefik to auto-generate a domain, you can keep this:
    environment:
      - SERVICE_FQDN_SERVER_3000

      # 2) Database connection
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}

      # 3) Redis
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:latest
    restart: always
    volumes:
      - db_data_pg:/var/lib/postgresql/data

    # Instead of referencing “SERVICE_” variables, just read DB_NAME & DB_PASSWORD
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379
