services:
  server:
    build:
      context: .
    volumes:
      - custom:/kutt/custom
    environment:
      # --- Domain auto-generated for port 3000 ---
      - SERVICE_FQDN_SERVER_3000

      # --- Reuse the same random DB name & password as Postgres ---
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${SERVICE_USER_PGDB}
      - DB_PASSWORD=${SERVICE_PASSWORD_PG}

      # --- Redis stuff remains the same ---
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres
    restart: always

    # --- The volumes remain, storing Postgres data locally ---
    volumes:
      - db_data_pg:/var/lib/postgresql/data

    environment:
      # --- Let Coolify generate a random DB name & password ---
      - SERVICE_USER_PGDB
      - SERVICE_PASSWORD_PG

      # --- Tell Postgres to use the random values ---
      - POSTGRES_DB=${SERVICE_USER_PGDB}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_PG}
      # Optional: If you want a random user as well, do this:
      # - SERVICE_USER_PGUSER
      # - POSTGRES_USER=${SERVICE_USER_PGUSER}

    expose:
      - 5432
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379

volumes:
  db_data_pg:
  custom:
