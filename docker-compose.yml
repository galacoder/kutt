version: "3.8"

volumes:
  db_data_pg:
  custom:

services:
  server:
    build:
      context: .
    volumes:
      - custom:/kutt/custom

    environment:
      # Instruct Coolify/Traefik to generate a domain & route to port 3000
      - SERVICE_FQDN_SERVER_3000

      # Database connection
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      # Use the random DB name & password that Postgres will generate
      - DB_NAME=${SERVICE_USER_DBNAME}
      - DB_PASSWORD=${SERVICE_PASSWORD_PG}

      # Redis connection
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:latest
    restart: always
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    environment:
      # Tell Coolify to generate these randomly (visible/editable in the UI)
      - SERVICE_USER_DBNAME
      - SERVICE_PASSWORD_PG

      # Map the generated values to Postgres
      - POSTGRES_DB=${SERVICE_USER_DBNAME}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_PG}
      # (If you need a random Postgres username, add:
      #  - SERVICE_USER_PGUSER
      #  - POSTGRES_USER=${SERVICE_USER_PGUSER}
      #  and reference it above.)

    expose:
      - 5432

    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    restart: always
    expose:
      - 6379
